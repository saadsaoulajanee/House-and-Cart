name: Render official House & Cart app icons
on:
  push:
    branches: [house-cart-v3-7-1-official-icon-02]
    paths:
      - assets/icon-02.svg
      - scripts/render_app_icons.py
      - .github/workflows/render-brand-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG rasterizer
        run: pip install 'cairosvg==2.7.1' 'pillow==11.2.1'
      - name: Render all app icon sizes
        run: python scripts/render_app_icons.py
      - name: Commit generated binary icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png icon-maskable-512.png favicon.png apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish icon 02 to all PWA and browser icon sizes"
            git push origin HEAD:house-cart-v3-7-1-official-icon-02
          fi
