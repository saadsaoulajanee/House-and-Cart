<script>

function getCareCategories(){return Array.isArray(db.settings.careCategories)?db.settings.careCategories:[]}
function validCareCategory(raw){
 const name=String(raw||'').trim().replace(/\s+/g,' ');
 return name&&name.length<=38&&!/[\x00-\x1f<>]/.test(name)&&!['__proto__','constructor','prototype'].includes(name.toLowerCase())?name:'';
}
function careCategoryOptions(name,item){
 const selected=categoriesOf(item);
 const choices=getCareCategories().map(cat=>'<label class="care-cat-chip"><input type="checkbox" name="'+name+'" value="'+esc(cat)+'" '+(selected.includes(cat)?'checked':'')+'><span>'+esc(cat)+'</span></label>').join('');
 return '<div class="care-cat-choices" role="group" aria-label="Choose one or more categories">'+(choices||'<p class="smalltext">Create a category using Manage categories.</p>')+'</div><p class="smalltext">Select as many categories as apply. An item remains a single stock record.</p>';
}
function careCheckedCategories(form,name){return [...form.querySelectorAll('input[name="'+name+'"]:checked')].map(x=>x.value).filter(x=>getCareCategories().includes(x))}
function careCategoryBadges(item){return categoriesOf(item).map(x=>'<span class="care-cat-label">'+esc(x)+'</span>').join('')||'<span class="care-cat-label care-cat-muted">Uncategorised</span>'}
function careCategoryError(message){const el=document.getElementById('careCategoryError');if(el){el.textContent=message;el.hidden=!message}else if(message)alert(message)}
function createCareCategory(value){
 const name=validCareCategory(value);
 if(!name){careCategoryError('Enter a valid category of 1–38 characters.');return false}
 if(getCareCategories().some(x=>norm(x)===norm(name))){careCategoryError('This category already exists.');return false}
 getCareCategories().push(name);save();render();openCareCategoryManager();return true;
}
function renameCareCategory(oldName,value){
 const name=validCareCategory(value),list=getCareCategories(),idx=list.indexOf(oldName);
 if(idx<0||!name){careCategoryError('Enter a valid category name.');return false}
 if(list.some((x,i)=>i!==idx&&norm(x)===norm(name))){careCategoryError('This name is already in use.');return false}
 list[idx]=name;
 for(const item of [...db.cleaningEssentials,...db.cleaningInventory,...db.cleaningShopping])
  syncCareCategoryFields(item,categoriesOf(item).map(x=>x===oldName?name:x));
 save();render();openCareCategoryManager();return true;
}
function deleteCareCategory(name){
 if(!getCareCategories().includes(name))return false;
 const n=[...db.cleaningEssentials,...db.cleaningInventory,...db.cleaningShopping].filter(x=>categoriesOf(x).includes(name)).length;
 if(!confirm('Remove category "'+name+'"? '+n+' item(s) will lose this category but remain saved.'))return false;
 db.settings.careCategories=getCareCategories().filter(x=>x!==name);
 for(const item of [...db.cleaningEssentials,...db.cleaningInventory,...db.cleaningShopping])
  syncCareCategoryFields(item,categoriesOf(item).filter(x=>x!==name));
 save();render();openCareCategoryManager();return true;
}
function openCareCategoryManager(){
 const rows=getCareCategories().map(cat=>{
  const n=db.cleaningEssentials.filter(x=>categoriesOf(x).includes(cat)).length;
  return '<div class="care-cat-edit-row" data-category="'+esc(cat)+'"><div class="care-cat-edit-main"><input aria-label="Rename '+esc(cat)+'" maxlength="38" value="'+esc(cat)+'"><small class="smalltext">'+n+' essentials</small></div><button type="button" class="btn soft small" data-action="rename">Save</button><button type="button" class="btn danger small" data-action="delete">Delete</button></div>';
 }).join('');
 showModal('Home Care categories','<p class="sub">Add, rename or delete categories. An essential can belong to several categories. Removing a category never deletes a product.</p><p id="careCategoryError" class="care-cat-error" role="alert" hidden></p><div id="careCatEditList" class="care-cat-edit-list">'+(rows||'<div class="empty">No categories yet.</div>')+'</div><form id="careCatCreateForm"><label for="newCareCat">New category</label><div class="care-cat-add"><input id="newCareCat" maxlength="38" required placeholder="e.g. Toiletries, Pets, Garden"><button class="btn green" type="submit">＋ Add</button></div></form>');
 document.getElementById('careCatEditList').onclick=e=>{
  const btn=e.target.closest('button[data-action]');if(!btn)return;
  const row=btn.closest('.care-cat-edit-row'),old=row.dataset.category;
  if(btn.dataset.action==='rename')renameCareCategory(old,row.querySelector('input').value);
  else deleteCareCategory(old);
 };
 document.getElementById('careCatCreateForm').onsubmit=e=>{e.preventDefault();createCareCategory(document.getElementById('newCareCat').value)};
}
function essentialsView(){
 const grouped=[...getCareCategories().map(name=>({name,items:db.cleaningEssentials.filter(x=>categoriesOf(x).includes(name))})),{name:'Uncategorised',items:db.cleaningEssentials.filter(x=>!categoriesOf(x).length)}].filter(x=>x.items.length||x.name!=='Uncategorised');
 const items=grouped.map(group=>{
  const rows=group.items.map(item=>{
   const inv=db.cleaningInventory.find(x=>x.essentialId===item.id);
   const status=inv?'<span class="badge '+(inv.qty<=inv.threshold?'orange':'')+'">'+(inv.qty<=inv.threshold?'Low':'Tracked')+'</span>':'<button class="btn soft small" onclick="trackEssential(\''+item.id+'\')">Track</button>';
   return '<div class="listline essential-row"><span class="essential-emoji">'+esc(item.emoji||'🧴')+'</span><div class="grow essential-main"><b>'+esc(item.name)+'</b><small>'+(inv?(inv.qty+' '+esc(inv.unit)+' in cupboard'):'Not tracked yet')+'</small></div><div class="essential-actions">'+status+'<button class="btn ghost small" aria-label="Edit '+esc(item.name)+'" onclick="openEssentialEditor(\''+item.id+'\')">✎</button></div></div>';
  }).join('');
  return '<section class="card span4 essentials-category" style="box-shadow:none"><h2>'+esc(group.name)+' <span class="care-cat-count">'+group.items.length+'</span></h2>'+(rows||'<p class="smalltext">Nothing here yet.</p>')+'</section>';
 }).join('');
 return '<div class="hero"><div><div class="eyebrow">Home Care · Essentials</div><h1>Household essentials</h1><p class="sub">A flexible system for every room. Give an essential multiple categories without duplicating it.</p></div><div class="row"><button class="btn soft" onclick="openCareCategoryManager()">⚙ Manage categories</button><button class="btn green" onclick="openEssentialEditor()">＋ Add essential</button></div></div><div class="card"><div class="sectionhead"><div><h2>Your essentials</h2><span class="smalltext">'+db.cleaningEssentials.length+' unique items · '+getCareCategories().length+' categories</span></div></div><div class="grid essentials-grid">'+(items||'<div class="empty full">No essentials yet. Add your first item.</div>')+'</div><p class="smalltext">An item in multiple categories is shown in each group but is only tracked once.</p></div>';
}
function openEssentialEditor(id=''){
 const item=id?db.cleaningEssentials.find(x=>x.id===id):{name:'',categories:[],emoji:'🧴'};if(!item)return;
 const body='<form id="essentialForm"><div class="field"><label>Essential name</label><input name="name" maxlength="70" required value="'+esc(item.name)+'" placeholder="e.g. Bathroom descaler"></div><div class="field"><div class="sectionhead"><label>Categories (multiple allowed)</label><button class="btn soft small" type="button" onclick="openCareCategoryManager()">Manage</button></div>'+careCategoryOptions('careCats',item)+'</div><div class="field"><label>Emoji</label><input name="emoji" maxlength="8" value="'+esc(item.emoji||'🧴')+'"></div><div class="row"><button class="btn green" type="submit">Save essential</button>'+(id?'<button class="btn danger" type="button" onclick="deleteEssentialType(\''+id+'\')">Delete essential</button>':'')+'</div></form>';
 showModal(id?'Edit essential':'Add essential',body);
 document.getElementById('essentialForm').onsubmit=e=>{
  e.preventDefault();const form=e.target,name=form.elements.name.value.trim();
  if(db.cleaningEssentials.some(x=>x.id!==id&&norm(x.name)===norm(name))){alert('That essential already exists.');return}
  const categories=careCheckedCategories(form,'careCats'),newItem=syncCareCategoryFields({id:id||uid(),name,emoji:form.elements.emoji.value.trim()||'🧴',qty:1,threshold:1,unit:'pack',essential:true},categories);
  if(id){
   const idx=db.cleaningEssentials.findIndex(x=>x.id===id);db.cleaningEssentials[idx]=newItem;
   db.cleaningInventory.forEach(x=>{if(x.essentialId===id){x.name=name;syncCareCategoryFields(x,categories)}});
  }else db.cleaningEssentials.push(newItem);
  save();closeModal();render();
 };
}

</script>
<script>


/* Quick Home Care stock adjustments also update automatic Restock thresholds. */
function adjustCareSupplyQuantity(id,direction){
 const item=db.cleaningInventory.find(x=>x.id===id);
 if(!item||Math.abs(Number(direction))!==1)return false;
 const before=Math.max(0,Number(item.qty)||0),step=pantryQuantityStep(item.unit);
 const next=Math.max(0,Number((before+Math.sign(direction)*step).toFixed(6)));
 if(before===next)return false;
 item.qty=next;
 autoRestock();
 save();
 const current=document.querySelector('#careSupplyList .supply-row[data-supply-id="'+id+'"]');
 if(current)current.outerHTML=cleanInventoryRow(item);
 return true;
}
function cleanInventoryRow(x){
 const cats=careCategoryBadges(x),step=pantryQuantityStep(x.unit);
 const amount=esc(formatQuantity(Number(x.qty)||0,x.unit)),increment=esc(formatQuantity(step,x.unit));
 return '<div class="listline supply-row" data-supply-id="'+esc(x.id)+'">'+
  '<span class="supply-emoji">'+cleanEmoji(x.name)+'</span>'+
  '<div class="supply-info"><b>'+esc(x.name)+'</b><small>'+amount+' · restock at '+esc(String(x.threshold))+'</small><div class="care-item-tags">'+cats+'</div></div>'+
  '<div class="supply-actions"><span class="badge '+(x.qty<=x.threshold?'orange':'gray')+'">'+(x.qty<=x.threshold?'Low':'In stock')+'</span>'+
  '<div class="pantry-quantity-controls care-supply-stepper" role="group" aria-label="Adjust '+esc(x.name)+' stock">'+
   '<button type="button" aria-label="Decrease '+esc(x.name)+' by '+increment+'" title="Subtract '+increment+'" onclick="adjustCareSupplyQuantity(\''+x.id+'\',-1)" '+(Number(x.qty)<=0?'disabled':'')+'>−</button>'+
   '<span class="pantry-current-quantity" aria-live="polite">'+amount+'</span>'+
   '<button type="button" aria-label="Increase '+esc(x.name)+' by '+increment+'" title="Add '+increment+'" onclick="adjustCareSupplyQuantity(\''+x.id+'\',1)">＋</button></div>'+
  '<button class="btn soft small" onclick="openCleanProduct(\''+x.id+'\')">Update</button></div></div>';
}
function cleanInventoryView(){
 return '<div class="hero"><div><div class="eyebrow">Home Care stock</div><h1>Supply cupboard</h1><p class="sub">Organise each product in multiple categories and keep accurate stock levels.</p></div><div class="row"><button class="btn soft" onclick="openCareCategoryManager()">⚙ Categories</button><button class="btn green" onclick="openCleanProduct()">＋ Add product</button></div></div><div class="card"><div class="sectionhead"><h2>Your products</h2><span class="badge">'+db.cleaningInventory.length+' tracked</span></div><div id="careSupplyList">'+(db.cleaningInventory.map(cleanInventoryRow).join('')||'<div class="empty">No products tracked yet. Add one above.</div>')+'</div></div>';
}
function trackEssential(id){
 const essential=db.cleaningEssentials.find(x=>x.id===id);if(!essential)return;
 if(db.cleaningInventory.some(x=>x.essentialId===id)){go('kitchen');return}
 const item=syncCareCategoryFields({id:uid(),essentialId:id,name:essential.name,qty:2,threshold:1,unit:'pack'},categoriesOf(essential));
 db.cleaningInventory.push(item);save();render();
}
function openCleanProduct(id=''){
 const existing=id?db.cleaningInventory.find(x=>x.id===id):null;
 const item=existing||{name:'',categories:[],qty:1,threshold:1,unit:'bottle',essentialId:''};
 if(id&&!existing)return;
 const options=[...new Set([...db.cleaningEssentials.map(x=>x.name),...db.cleaningInventory.map(x=>x.name)])].sort((a,b)=>a.localeCompare(b)).map(name=>'<option value="'+esc(name)+'"></option>').join('');
 const body='<form id="cleanForm"><div class="field"><label>Product</label><input name="name" required data-autocomplete-list="cleanNames" value="'+esc(item.name)+'" placeholder="e.g. Dishwashing liquid"><datalist id="cleanNames">'+options+'</datalist></div><div class="field"><div class="sectionhead"><label>Categories (select multiple)</label><button type="button" class="btn soft small" onclick="openCareCategoryManager()">Manage</button></div>'+careCategoryOptions('careStockCats',item)+'</div><div class="two"><div class="field"><label>Unit</label><input name="unit" value="'+esc(item.unit)+'" placeholder="bottle, pack…"></div><div class="field"><label>Quantity you have</label><input name="qty" type="number" min="0" step="any" value="'+item.qty+'" required></div><div class="field"><label>Low-stock threshold</label><input name="threshold" type="number" min="0" step="any" value="'+item.threshold+'" required></div></div><p class="smalltext">When quantity is low, the product is offered for restocking. Checked purchases disappear from Restock two hours after purchase.</p><div class="row"><button type="submit" class="btn green">Save product</button>'+(id?'<button type="button" class="btn danger" onclick="deleteCleanProduct(\''+id+'\')">Delete</button>':'')+'</div></form>';
 showModal(id?'Update supply cupboard':'Add a product',body);
 const form=document.getElementById('cleanForm');
 form.elements.name.addEventListener('change',()=>{
  if(id)return;
  const essential=db.cleaningEssentials.find(x=>norm(x.name)===norm(form.elements.name.value));
  if(essential){const chosen=categoriesOf(essential);form.querySelectorAll('input[name="careStockCats"]').forEach(ch=>{ch.checked=chosen.includes(ch.value)})}
 });
 form.onsubmit=e=>{
  e.preventDefault();const name=form.elements.name.value.trim(),essential=db.cleaningEssentials.find(x=>norm(x.name)===norm(name));
  const categories=careCheckedCategories(form,'careStockCats');
  const obj=syncCareCategoryFields({id:id||uid(),essentialId:essential?.id||'',name,unit:form.elements.unit.value.trim()||'unit',qty:Number(form.elements.qty.value),threshold:Number(form.elements.threshold.value)},categories);
  if(!Number.isFinite(obj.qty)||obj.qty<0||!Number.isFinite(obj.threshold)||obj.threshold<0){alert('Enter valid non-negative stock quantities.');return}
  if(id)db.cleaningInventory[db.cleaningInventory.findIndex(x=>x.id===id)]=obj;
  else db.cleaningInventory.push(obj);
  autoRestock();save();closeModal();render();
 };
}
function autoRestock(){
 for(const item of db.cleaningInventory){
  const existing=db.cleaningShopping.find(x=>x.inventoryId===item.id);
  if(item.qty<=item.threshold&&!existing){
   db.cleaningShopping.push(syncCareCategoryFields({id:uid(),inventoryId:item.id,name:item.name,qty:1,unit:item.unit,checked:false,auto:true},categoriesOf(item)));
  }else if(existing&&!existing.checked){
   existing.name=item.name;existing.unit=item.unit;syncCareCategoryFields(existing,categoriesOf(item));
   if(item.qty>item.threshold&&existing.auto)db.cleaningShopping=db.cleaningShopping.filter(x=>x.id!==existing.id);
  }
 }
}
function addCleanManual(){
 const names=[...new Set([...db.cleaningEssentials.map(x=>x.name),...db.cleaningInventory.map(x=>x.name)])].sort((a,b)=>a.localeCompare(b));
 const formBody='<form id="cleanAddForm"><div class="field"><label>Product to restock</label><input name="name" required maxlength="90" data-autocomplete-list="careRestockNames" placeholder="Search a product or enter a new one"><datalist id="careRestockNames">'+names.map(name=>'<option value="'+esc(name)+'"></option>').join('')+'</datalist></div><div class="field"><label>Categories</label>'+careCategoryOptions('careRestockCats',{categories:[]})+'</div><button type="submit" class="btn green">Add to cart</button></form>';
 showModal('Add to Home Care restock',formBody);
 document.getElementById('cleanAddForm').onsubmit=e=>{
  e.preventDefault();const form=e.target,name=form.elements.name.value.trim();
  db.cleaningShopping.push(syncCareCategoryFields({id:uid(),name,qty:1,checked:false,auto:false},careCheckedCategories(form,'careRestockCats')));
  save();closeModal();render();
 };
}
function cleanShopView(){
 const items=db.cleaningShopping;
 const remaining=items.filter(x=>!x.checked).length,bought=items.filter(x=>x.checked).length;
 const rows=items.map(x=>{
  const caption=x.checked?'Bought · automatically clears 2 hours after purchase':(x.auto?'Added automatically':'Added manually');
  return '<div class="listline care-restock-line"><input class="check" type="checkbox" aria-label="Mark '+esc(x.name)+' as bought" '+(x.checked?'checked':'')+' onchange="toggleCleanShop(\''+x.id+'\',this.checked)"><span class="care-restock-emoji">'+cleanEmoji(x.name)+'</span><div class="grow '+(x.checked?'strike':'')+'"><b>'+esc(x.name)+'</b><small>'+caption+'</small><div class="care-item-tags">'+careCategoryBadges(x)+'</div></div><button type="button" class="btn danger small" aria-label="Remove '+esc(x.name)+'" onclick="removeCleanShop(\''+x.id+'\')">×</button></div>';
 }).join('');
 return '<div class="hero"><div><div class="eyebrow">Home Care · Restocking</div><h1>Restock cart</h1><p class="sub">'+remaining+' still needed · '+bought+' purchased. Checked items clear automatically after two hours.</p></div><div class="row"><button class="btn soft" onclick="openCareTrip()">＋ Log shopping trip</button><button class="btn green" onclick="addCleanManual()">＋ Add item</button></div></div><div class="card"><div class="sectionhead"><h2>Shopping checklist</h2><span class="badge">'+items.length+' items</span></div>'+(rows||'<div class="empty">All stocked up. Your Home Care restock list is empty.</div>')+'<p class="smalltext" style="margin:12px 0 0">Tick purchased items to credit one unit to the cupboard. You can undo a tick before it expires. Log a trip to keep a spending record, even after items disappear from this list.</p></div>';
}
function toggleCleanShop(id,value){
 const item=db.cleaningShopping.find(x=>x.id===id);if(!item||item.checked===value)return;
 const inventory=db.cleaningInventory.find(x=>x.id===item.inventoryId);
 if(value){
  item.checked=true;item.checkedAt=new Date().toISOString();
  if(inventory){inventory.qty=Number(inventory.qty||0)+Number(item.qty||1);item.stockCredited=true}
 }else{
  item.checked=false;delete item.checkedAt;
  if(item.stockCredited&&inventory)inventory.qty=Math.max(0,Number(inventory.qty||0)-Number(item.qty||1));
  delete item.stockCredited;
 }
 save();render();scheduleCareRestockCleanup();
}
let careRestockCleanupTimer=null;
function purgeExpiredCareRestock(now=Date.now()){
 const before=db.cleaningShopping.length;
 db.cleaningShopping=db.cleaningShopping.filter(x=>!x.checked||!Number.isFinite(Date.parse(x.checkedAt||''))||now-Date.parse(x.checkedAt)<CARE_RESTOCK_EXPIRE_MS);
 const removed=before-db.cleaningShopping.length;
 if(removed){save();render()}
 scheduleCareRestockCleanup();
 return removed;
}
function scheduleCareRestockCleanup(){
 clearTimeout(careRestockCleanupTimer);
 const deadlines=db.cleaningShopping.filter(x=>x.checked&&Number.isFinite(Date.parse(x.checkedAt||''))).map(x=>Date.parse(x.checkedAt)+CARE_RESTOCK_EXPIRE_MS);
 if(deadlines.length)careRestockCleanupTimer=setTimeout(()=>purgeExpiredCareRestock(),Math.max(50,Math.min(2147483647,Math.min(...deadlines)-Date.now()+50)));
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)purgeExpiredCareRestock()});
window.addEventListener('focus',()=>purgeExpiredCareRestock());
purgeExpiredCareRestock();

</script>
<script>

function careMonthBudget(month=currentBudgetMonth()){
 db.settings.careMonthlyBudgets??={};
 if(!Object.prototype.hasOwnProperty.call(db.settings.careMonthlyBudgets,month))db.settings.careMonthlyBudgets[month]=Number(db.settings.careBudget)||100;
 return Number(db.settings.careMonthlyBudgets[month])||0;
}
function careMonthSpent(month=currentBudgetMonth()){return db.cleaningHistory.filter(x=>String(x.date||'').slice(0,7)===month).reduce((sum,x)=>sum+(Number(x.total)||0),0)}
function careTripMonths(){return [...new Set([currentBudgetMonth(),...db.cleaningHistory.map(t=>String(t.date||'').slice(0,7)).filter(x=>/^\d{4}-\d{2}$/.test(x))])].sort().reverse()}
function careHistoryView(){
 const trips=db.cleaningHistory.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
 const sum=trips.reduce((v,x)=>v+Number(x.total||0),0);
 const cards=trips.map(trip=>{
  const items=(trip.items||[]).map(x=>typeof x==='string'?x:x.name).filter(Boolean);
  return '<article class="card care-trip-card"><div class="care-trip-head"><div><b>'+esc(trip.store||'Shopping trip')+'</b><p class="smalltext">'+esc(trip.date||'')+' · '+items.length+' item'+(items.length===1?'':'s')+'</p></div><strong class="care-trip-price">'+money(trip.total)+'</strong></div>'+(items.length?'<p class="smalltext">'+esc(items.join(' · '))+'</p>':'')+(trip.notes?'<details><summary class="smalltext">Trip notes</summary><p class="smalltext">'+esc(trip.notes)+'</p></details>':'')+'<div class="care-trip-actions"><button type="button" class="btn soft small" onclick="openCareTrip(\''+trip.id+'\')">Edit trip</button><button type="button" class="btn danger small" onclick="deleteCareTrip(\''+trip.id+'\')">Delete</button></div></article>';
 }).join('');
 return '<div class="hero"><div><div class="eyebrow">Home Care · Spending journal</div><h1>Shopping history</h1><p class="sub">Log every trip, whatever the store. Keep totals, purchased items and notes in one place.</p></div><button class="btn green" onclick="openCareTrip()">＋ Log shopping trip</button></div><div class="grid"><div class="card span4 stat"><span>Trips recorded</span><strong>'+trips.length+'</strong><span>Across all places</span></div><div class="card span4 stat"><span>Total recorded</span><strong>'+money(sum)+'</strong><span>Since you started tracking</span></div><div class="card span4 stat"><span>Spent this month</span><strong>'+money(careMonthSpent())+'</strong><span>'+esc(budgetMonthLabel(currentBudgetMonth()))+'</span></div></div><div class="care-trip-list">'+(cards||'<div class="empty">Your Home Care trip history is empty. Add a trip to start tracking places and spending.</div>')+'</div>';
}
function openCareTrip(id=''){
 const existing=id?db.cleaningHistory.find(x=>x.id===id):null;
 if(id&&!existing)return;
 const newItems=db.cleaningShopping.filter(x=>x.checked&&!x.loggedTripId).map(x=>x.name);
 const trip=existing||{store:'',date:dateKey(new Date()),total:'',items:newItems,notes:''};
 const items=(trip.items||[]).map(x=>typeof x==='string'?x:x.name).filter(Boolean);
 const body='<form id="careTripForm"><div class="two"><div class="field"><label for="careTripStore">Store or place</label><input id="careTripStore" name="store" maxlength="100" required placeholder="e.g. Carrefour, Leroy Merlin, local market" value="'+esc(trip.store||'')+'"></div><div class="field"><label>Date of trip</label><input type="date" name="date" required value="'+esc(trip.date||dateKey(new Date()))+'"></div><div class="field"><label>Total spent (€)</label><input name="total" type="number" min="0" step=".01" required value="'+esc(trip.total??'')+'" placeholder="0.00"></div></div><div class="field"><label>Purchased items (one per line, optional)</label><textarea name="items" rows="5" placeholder="Laundry detergent\nBin bags\nCleaning cloths">'+esc(items.join('\n'))+'</textarea></div><div class="field"><label>Notes (optional)</label><textarea name="notes" rows="3" placeholder="Receipt details, location or reminder">'+esc(trip.notes||'')+'</textarea></div><p class="smalltext">Trip records are separate from your restock checklist and are retained after checked items automatically disappear.</p><div class="row"><button type="submit" class="btn green">'+(id?'Save changes':'Save shopping trip')+'</button><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button></div></form>';
 showModal(id?'Edit shopping trip':'Log a shopping trip',body);
 document.getElementById('careTripForm').onsubmit=e=>{
  e.preventDefault();const form=e.target,total=Number(form.elements.total.value),store=form.elements.store.value.trim();
  if(!store||!Number.isFinite(total)||total<0){alert('Enter a place and a valid total.');return}
  const record={id:id||uid(),store,date:form.elements.date.value,total,items:form.elements.items.value.split('\n').map(x=>x.trim()).filter(Boolean),notes:form.elements.notes.value.trim(),createdAt:existing?.createdAt||new Date().toISOString()};
  if(id)db.cleaningHistory[db.cleaningHistory.findIndex(x=>x.id===id)]=record;
  else{
   db.cleaningHistory.unshift(record);
   for(const row of db.cleaningShopping)if(row.checked&&!row.loggedTripId)row.loggedTripId=record.id;
  }
  save();closeModal();render();
 };
}
function deleteCareTrip(id){
 const item=db.cleaningHistory.find(x=>x.id===id);if(!item)return;
 if(!confirm('Delete the shopping trip at '+item.store+' on '+item.date+'? This cannot be undone.'))return;
 db.cleaningHistory=db.cleaningHistory.filter(x=>x.id!==id);
 for(const row of db.cleaningShopping)if(row.loggedTripId===id)delete row.loggedTripId;
 save();render();
}
function careBudgetView(){
 const month=window.careBudgetMonth||currentBudgetMonth(),target=careMonthBudget(month),spent=careMonthSpent(month),left=target-spent;
 const monthTrips=db.cleaningHistory.filter(x=>String(x.date||'').slice(0,7)===month);
 const places=new Map();
 for(const x of monthTrips){const key=x.store||'Other store',entry=places.get(key)||{total:0,count:0};entry.total+=Number(x.total)||0;entry.count++;places.set(key,entry)}
 const placeRows=[...places].sort((a,b)=>b[1].total-a[1].total).map(([name,val])=>'<div class="care-place-row"><span class="grow"><b>'+esc(name)+'</b><small>'+val.count+' trip'+(val.count===1?'':'s')+'</small></span><strong>'+money(val.total)+'</strong></div>').join('');
 return '<div class="hero"><div><div class="eyebrow">Home Care · Spending</div><h1>Household budget</h1><p class="sub">Separate from your Kitchen budget. Record visits to different places and see where your Home Care money goes.</p></div><button type="button" class="btn green" onclick="openCareTrip()">＋ Log a trip</button></div><div class="card care-budget-toolbar"><div class="field"><label>Budget month</label><input type="month" aria-label="Choose Home Care budget month" value="'+esc(month)+'" onchange="window.careBudgetMonth=this.value;render()"></div><div class="field"><label>Spending limit for '+esc(budgetMonthLabel(month))+'</label><input type="number" min="0" step=".01" value="'+target+'" onchange="db.settings.careMonthlyBudgets[\''+month+'\']=Math.max(0,Number(this.value)||0);save();render()"></div></div><div class="grid care-budget-stats"><div class="card span4 stat"><span>Monthly budget</span><strong>'+money(target)+'</strong></div><div class="card span4 stat"><span>Spent so far</span><strong>'+money(spent)+'</strong></div><div class="card span4 stat"><span>'+(left>=0?'Remaining':'Over budget')+'</span><strong>'+money(Math.abs(left))+'</strong></div></div><div class="card care-budget-breakdown"><div class="sectionhead"><h2>By store · '+esc(budgetMonthLabel(month))+'</h2><span class="badge">'+monthTrips.length+' trips</span></div><div class="progress"><i style="width:'+Math.min(100,target?spent/target*100:(spent?100:0))+'%"></i></div>'+(placeRows||'<div class="empty">No trips recorded for this month.</div>')+'<div class="care-budget-actions"><button class="btn soft small" onclick="go(\'history\')">View all trips →</button></div></div>';
}

</script>
</body></html>
