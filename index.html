/* Cloud sync status: always visible on mobile and desktop */
.cloud-status-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 12px;padding:9px 12px;border:1px solid #d5dce8;border-radius:12px;background:#f8fafc;color:#334155;font-size:13px}
.cloud-status-dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:#94a3b8}
.cloud-status-bar[data-state="synced"] .cloud-status-dot{background:#16a34a}
.cloud-status-bar[data-state="syncing"] .cloud-status-dot{background:#d97706}
.cloud-status-bar[data-state="pending"] .cloud-status-dot{background:#d97706}
.cloud-status-bar[data-state="error"] .cloud-status-dot,.cloud-status-bar[data-state="offline"] .cloud-status-dot{background:#dc2626}
.cloud-status-bar strong{font-weight:700}
.cloud-status-bar .cloud-status-detail{font-size:11px;opacity:.75}
.cloud-status-bar .cloud-status-button{margin-left:auto;border:1px solid #cbd5e1;border-radius:9px;background:white;color:#334155;padding:6px 10px;font:inherit;cursor:pointer}
.cloud-status-bar .cloud-status-button:disabled{opacity:.5;cursor:wait}

async function syncNow(mode='both'){

 if(!navigator.onLine){const el=document.getElementById('saveState');if(el)el.textContent='Cloud sync pending · offline';refreshCloudStatus();return false}
 syncBusy=true;
 let syncCompleted=false;
 const status=document.getElementById('saveState');if(status)status.textContent='Syncing…';
 try{
  const {data:remote,error}=await sb.from('mealcart_sync_state').select('payload,updated_at').eq('owner_id',cloudUser.id).maybeSingle();
  if(error)throw error;
  const local=cloudPayload(),localText=comparableCloudText(local);
  const remoteText=remote?.payload?comparableCloudText(remote.payload):null;
  let action='none';
  if(!remoteText)action='upload';
  else if(remoteText===localText)action='none';
  else if(!lastCloudPayload)action=meaningfulHomeData(local)?'choose':'download';
  else if(remoteText===lastCloudPayload)action='upload';
  else if(localText===lastCloudPayload)action='download';
  else action='choose';
  if(action==='choose'){
   const conflictToken=conflictPairToken(localText,remoteText);
   if(mode!=='manual'&&conflictIsDismissed(cloudUser.id,conflictToken)){action='cancel'}
   else{
    const picked=await chooseCloudConflict();
    if(picked==='cancel')dismissConflict(cloudUser.id,conflictToken);
    action=picked==='local'?'upload':picked==='cloud'?'download':'cancel';
   }
  }
  if(action==='cancel'){
   if(status)status.textContent='Cloud sync pending · choose a version';
   return false;
  }
  if(action==='download'){
   if(!snapshotForRecovery('Before cloud download'))throw Error('A recovery copy could not be saved on this device. Download a backup from the Menu first, then retry sync.');
   applyCloudPayload(remote.payload);
   markCloudSynced(remote.payload,remote.updated_at);
  }else if(action==='upload'){
   const timestamp=new Date().toISOString();
   let write;
   if(remote){
    let request=sb.from('mealcart_sync_state').update({payload:local,updated_at:timestamp}).eq('owner_id',cloudUser.id);
    request=remote.updated_at?request.eq('updated_at',remote.updated_at):request.is('updated_at',null);
    write=await request.select('updated_at');
    if(write.error)throw write.error;
    if(!write.data?.length)throw Error('Cloud data changed on another device while syncing. Please tap Sync now again to review the latest version.');
   }else{
    write=await sb.from('mealcart_sync_state').insert({owner_id:cloudUser.id,payload:local,updated_at:timestamp}).select('updated_at');
    if(write.error)throw write.error;
   }
   markCloudSynced(local,write.data?.[0]?.updated_at||timestamp);
  }else{
   markCloudSynced(local,remote?.updated_at);
  }

  return true;
 }catch(e){

 }finally{

}

  milligram:'mg',milligrams:'mg',milligramme:'mg',milligrammes:'mg',

function cookingUsage(mealId,variantId='',servings){

 if(!(count>0&&Number.isFinite(count)))return null;

  const ing=ingById(row.ingredientId);

  let left=need.qty,available=0;
  const matching=db.inventory.filter(row=>row.ingredientId===need.ingredientId&&!row.isSpice&&convertQty(1,row.unit,need.unit)!==null).sort(sortInventory);

   const inUnit=convertQty(capacity.get(row.id),row.unit,need.unit);

function recordCookedMeal(mealId,variantId='',servings=1,day='',occasion=''){
 const planned=day&&occasion?db.plan[day]?.[occasion]:null;
 if(day&&occasion&&(!planned||planned.mealId!==mealId||planned.cookedAt))return null;
 const result=cookingUsage(mealId,variantId,servings);
 if(!result)return null;
 for(const delta of result.deductions){
  const row=db.inventory.find(x=>x.id===delta.inventoryId);
  if(!row)continue;
  row.qty=Math.max(0,Number((Math.max(0,Number(row.qty)||0)-delta.qty).toPrecision(12)));
 }
 const now=new Date().toISOString(),id=uid();
 db.cookingHistory??=[];
 db.cookingHistory.push({id,mealId,mealName:result.recipe.name,variantId:result.recipe.versionId||'',versionName:result.recipe.versionName,servings:result.servings,cookedAt:now,day:day||'',occasion:occasion||'',deductions:result.deductions,missing:result.lines.filter(x=>x.missing>1e-8).map(x=>({ingredientId:x.ingredientId,qty:x.missing,unit:x.unit}))});
 if(planned){planned.cookedAt=now;planned.cookLogId=id}
 save();
 return result;
}

function aggregatePlan(){let map={};for(const p of plannedThisWeek({includeCooked:false})){let parent=mealById(p.mealId),m=resolveRecipe(parent,p.variantId);if(!m)continue;let factor=(Number(p.servings)||m.servings||1)/(Number(m.servings)||1);for(const line of m.ingredients||[]){let ing=ingById(line.ingredientId);if(!ing||isSpice(ing))continue;let unit=line.unit||ing.unit||'piece',info=unitInfo(unit),key=ing.id+'::'+info.family;map[key]??={ingredientId:ing.id,qty:0,unit,category:ing.category};let converted=convertQty(Number(line.qty||0),unit,map[key].unit);map[key].qty+=Number(converted===null?line.qty:converted)*factor;}}return map}
function autoAddOutOfStockSpices(){for(const ing of db.ingredients.filter(isSpice)){let inv=db.inventory.find(x=>x.ingredientId===ing.id);let out=!!inv&&inv.spiceStatus==='out';let existing=db.shopping.find(x=>x.source==='spice-auto'&&x.ingredientId===ing.id);if(out&&!existing)db.shopping.push({id:uid(),ingredientId:ing.id,name:ing.name,category:'Spices',qty:0,unit:'',checked:false,source:'spice-auto',auto:true,price:0});if(!out&&existing)db.shopping=db.shopping.filter(x=>!(x.source==='spice-auto'&&x.ingredientId===ing.id))}}
function addShoppingFromPlan(){let agg=Object.values(aggregatePlan()),oldPlan=db.shopping.filter(x=>x.source==='plan'),other=db.shopping.filter(x=>x.source!=='plan');let next=[];for(const need of agg){let have=pantryQty(need.ingredientId,need.unit),remaining=Math.max(0,need.qty-have);let prior=oldPlan.find(x=>x.ingredientId===need.ingredientId&&convertQty(1,x.unit,need.unit)!==null);if(remaining>0.000001){next.push({id:prior?.id||uid(),ingredientId:need.ingredientId,name:ingById(need.ingredientId)?.name||'Ingredient',qty:remaining,unit:need.unit,category:need.category,checked:prior?.checked||false,source:'plan',price:prior?.price||0,plannedQty:need.qty,pantryDeducted:Math.min(have,need.qty)});}}db.shopping=[...other,...next];autoAddOutOfStockSpices();save();render();let covered=agg.filter(x=>pantryQty(x.ingredientId,x.unit)>=x.qty).length;alert('Shopping list updated. Pantry stock was deducted from planned quantities.'+(covered?' '+covered+' ingredient(s) are fully covered by your pantry.':''))}

function cleanRecipeFamilyName(raw){
 const name=String(raw||'').trim().replace(/\s+/g,' ');

}
function renameRecipeFamily(oldName,raw){
 const name=cleanRecipeFamilyName(raw),list=getRecipeFamilies(),i=list.indexOf(oldName);
 if(i<0){recipeFamilyError('Family not found.');return false}
 if(!name){recipeFamilyError('Enter a family name of 1–35 characters.');return false}
 if(list.some((v,j)=>j!==i&&norm(v)===norm(name))){recipeFamilyError('That family already exists.');return false}
 ensureRecipeFamilies()[i]=name;

function openVariantEditor(mealId,variantId=''){

function saveRecipeVariant(event,mealId,variantId=''){
 event.preventDefault();
 const m=mealById(mealId),form=event.target;
 if(!m)return;
 const name=form.elements.variantName.value.trim().replace(/\s+/g,' ');
 if(!name||name.length>45){alert('Give this variation a name of up to 45 characters.');return}
 if(name.toLowerCase()==='original'||(m.variants||[]).some(v=>v.id!==variantId&&norm(v.name)===norm(name))){alert('Use a unique variation name other than Original.');return}
 const excluded=[...form.querySelectorAll('.variant-base-remove:checked')].map(x=>x.value);
 const rows=[...form.querySelectorAll('#variantIngredients .ingredient-row')];
 const changes=[];
 for(const row of rows){
  const ingredientId=row.querySelector('.ing-choice').value;
  if(!ingredientId)continue;
  const ing=ingById(ingredientId),spice=isSpice(ing),q=row.querySelector('.ing-qty').value,unit=spice?'':selectedUnit(row.querySelector('.ing-unit'));
  if(!spice&&(!q||!unit||Number(q)<0)){alert('Enter a quantity and unit for each variation ingredient.');return}
  const item={ingredientId,qty:spice?null:Number(q),unit};
  const old=changes.findIndex(x=>x.ingredientId===ingredientId);
  if(old>=0)changes[old]=item;else changes.push(item);
 }
 const customSteps=form.querySelector('#variantCustomSteps').checked;
 const steps=customSteps?form.elements.variantSteps.value.split(/\n+/).map(x=>x.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean):null;
 const variant={id:variantId||uid(),name,removeIds:excluded,ingredientChanges:changes,steps,tags:tagsOfForm(form,'variantTags')};
 m.variants??=[];
 if(variantId){const index=m.variants.findIndex(v=>v.id===variantId);if(index<0)return;m.variants[index]=variant}
 else m.variants.push(variant);
 save();render();openRecipe(mealId,variant.id);
}
function deleteRecipeVariant(mealId,variantId){
 const m=mealById(mealId),v=recipeVersion(m,variantId);if(!v)return;
 let count=0;
 for(const day of Object.values(db.plan||{}))for(const slot of Object.values(day||{}))if(slot?.mealId===mealId&&slot?.variantId===variantId)count++;
 if(!confirm('Delete the variation "'+v.name+'"?'+(count?' '+count+' planned meal(s) using it will revert to the original version.':'')+' The original recipe stays intact.'))return;
 m.variants=m.variants.filter(item=>item.id!==variantId);
 for(const day of Object.values(db.plan||{}))for(const slot of Object.values(day||{}))if(slot?.mealId===mealId&&slot?.variantId===variantId)delete slot.variantId;
 save();render();openVariantManager(mealId);
}

function syncSearchPicker(input){
 const target=document.getElementById(input.dataset.target);
 if(!target)return;
 const query=norm(input.value);
 const options=[...target.options].filter(o=>o.value);
 const previouslySelected=options.find(o=>o.value===target.value&&norm(o.textContent)===query);
 const matched=previouslySelected||options.find(o=>norm(o.textContent)===query);
 const next=matched?matched.value:'';
 if(target.value!==next){
  target.value=next;
  target.dispatchEvent(new Event('change',{bubbles:true}));
 }
 input.setCustomValidity(query&&!matched?'Choose an item from the suggestions, or clear the search.':'');
}

function autocompleteClose(input){
 if(!input)return;
 const host=input.closest('.app-autocomplete');
 if(!host)return;
 host.classList.remove('autocomplete-open');
 input.setAttribute('aria-expanded','false');
 input.removeAttribute('aria-activedescendant');
 const panel=host.querySelector('.app-autocomplete-menu');
 if(panel)panel.replaceChildren();
}
function autocompletePosition(input){
 const host=input?.closest('.app-autocomplete');
 if(!host?.classList.contains('autocomplete-open'))return;
 const panel=host.querySelector('.app-autocomplete-menu');
 if(!panel)return;
 const rect=input.getBoundingClientRect(),viewport=window.visualViewport;
 const visibleTop=viewport?viewport.offsetTop:0;
 const visibleBottom=visibleTop+(viewport?viewport.height:window.innerHeight);
 const gap=6;
 const below=Math.max(0,visibleBottom-rect.bottom-gap);
 const above=Math.max(0,rect.top-visibleTop-gap);
 const upward=below<175&&above>below;
 const available=upward?above:below;
 const maxHeight=window.innerWidth<=600?240:275;
 panel.style.position='fixed';
 panel.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-168))+'px';
 panel.style.width=Math.max(160,Math.min(rect.width,window.innerWidth-Math.max(8,Math.min(rect.left,window.innerWidth-168))-8))+'px';
 panel.style.top=(upward?rect.top-gap:rect.bottom+gap)+'px';
 panel.style.transform=upward?'translateY(-100%)':'none';
 panel.style.maxHeight=Math.max(65,Math.min(maxHeight,available-8))+'px';
}
function autocompleteChoose(input,entry){
 const target=input.dataset.target?document.getElementById(input.dataset.target):null;
 input.value=entry.value;
 if(target){
  target.value=entry.id||[...target.options].find(o=>o.value&&norm(o.textContent)===norm(entry.value))?.value||'';
  input.setCustomValidity('');
  target.dispatchEvent(new Event('change',{bubbles:true}));
 }else{
  input.dispatchEvent(new Event('input',{bubbles:true}));
  input.dispatchEvent(new Event('change',{bubbles:true}));
 }
 autocompleteClose(input);
 input.focus({preventScroll:true});
}
function autocompleteShow(input){
 const host=input.closest('.app-autocomplete'),panel=host?.querySelector('.app-autocomplete-menu');
 if(!panel)return;
 const query=input.value.trim();
 const matches=autocompleteEntries(input).filter(o=>!query||fieldWordMatch(o.search,query)).slice(0,35);
 panel.replaceChildren();
 if(!matches.length){
  const empty=document.createElement('div');
  empty.className='app-autocomplete-empty';
  empty.textContent=input.dataset.target?'No matching ingredients or recipes in your library.':'No suggestions. You can enter a new product name.';
  panel.append(empty);
 }else{
  matches.forEach((entry,i)=>{
   const button=document.createElement('button');
   button.type='button';
   button.className='app-autocomplete-option';
   button.setAttribute('role','option');
   button.setAttribute('aria-selected','false');
   button.id=input.dataset.autocompleteId+'_opt_'+i;
   const name=document.createElement('span');
   name.className='app-autocomplete-name';
   name.textContent=entry.label;
   button.append(name);
   if(entry.detail){
    const detail=document.createElement('small');
    detail.textContent=entry.detail;
    button.append(detail);
   }
   // Pick on pointerdown so Android cannot blur the input or swallow the tap.
   button.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    e.preventDefault();
    autocompleteChoose(input,entry);
   });
   button.addEventListener('click',()=>{
    if(host.classList.contains('autocomplete-open'))autocompleteChoose(input,entry);
   });
   panel.append(button);
  });
 }
 host.classList.add('autocomplete-open');
 input.setAttribute('aria-expanded','true');
 autocompletePosition(input);
}
function autocompleteInit(input){
 if(!input||input.dataset.autocompleteReady)return;
 const list=input.dataset.autocompleteList||input.getAttribute('list');
 if(!list)return;
 input.dataset.autocompleteReady='1';
 input.dataset.autocompleteList=list;
 input.removeAttribute('list');
 input.setAttribute('autocomplete','off');
 input.setAttribute('role','combobox');
 input.setAttribute('aria-haspopup','listbox');
 input.setAttribute('aria-autocomplete','list');
 input.setAttribute('aria-expanded','false');
 const host=input.closest('.search-picker')||input.parentElement;
 host.classList.add('app-autocomplete');
 const panel=document.createElement('div');
 panel.className='app-autocomplete-menu';
 panel.id='suggest_'+uid();
 panel.setAttribute('role','listbox');
 input.dataset.autocompleteId=panel.id;
 input.setAttribute('aria-controls',panel.id);
 host.append(panel);
}
document.addEventListener('focusin',e=>{
 const input=e.target;
 if(!(input instanceof HTMLInputElement))return;
 if(input.hasAttribute('data-autocomplete-list')||input.hasAttribute('list'))autocompleteInit(input);
 if(input.dataset.autocompleteReady)autocompleteShow(input);
});
document.addEventListener('input',e=>{
 const input=e.target;
 if(input instanceof HTMLInputElement&&input.dataset.autocompleteReady)autocompleteShow(input);
});
document.addEventListener('keydown',e=>{
 const input=e.target;
 if(!(input instanceof HTMLInputElement)||!input.dataset.autocompleteReady)return;
 const host=input.closest('.app-autocomplete');
 if(e.key==='Escape'){autocompleteClose(input);return}
 if(e.key==='ArrowDown'&&host&&!host.classList.contains('autocomplete-open')){
  e.preventDefault();autocompleteShow(input);return;
 }
 const buttons=[...(host?.querySelectorAll('.app-autocomplete-option')||[])];
 if(!buttons.length)return;
 const selected=buttons.findIndex(b=>b.classList.contains('active'));
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){
  e.preventDefault();
  const next=e.key==='ArrowDown'?(selected+1)%buttons.length:(selected-1+buttons.length)%buttons.length;
  buttons.forEach((b,i)=>{b.classList.toggle('active',i===next);b.setAttribute('aria-selected',String(i===next))});
  input.setAttribute('aria-activedescendant',buttons[next].id);
  buttons[next].scrollIntoView({block:'nearest'});
 }else if(e.key==='Enter'&&selected>=0){
  e.preventDefault();buttons[selected].click();
 }
});
document.addEventListener('pointerdown',e=>{
 document.querySelectorAll('.app-autocomplete.autocomplete-open').forEach(host=>{
  if(!host.contains(e.target))autocompleteClose(host.querySelector('input[data-autocomplete-ready]'));
 });
});
document.addEventListener('focusout',e=>{
 const input=e.target;
 if(!(input instanceof HTMLInputElement)||!input.dataset.autocompleteReady)return;
 requestAnimationFrame(()=>{
  if(!input.closest('.app-autocomplete')?.contains(document.activeElement))autocompleteClose(input);

});

const CORE_MEAL_SLOTS=['Breakfast','Lunch','Dinner'];

function safeOccasionParam(s){return encodeURIComponent(String(s)).replace(/'/g,'%27')}
function getMealOccasions(){
 const seen=new Set(),result=[];
 const add=name=>{if(typeof name!=='string')return;name=name.trim().replace(/\s+/g,' ');const key=norm(name);if(!key||seen.has(key)||name.length>45)return;seen.add(key);result.push(name)};
 MEAL_SLOTS.forEach(add);
 (db.settings?.customMealOccasions||[]).forEach(add);
 (db.meals||[]).forEach(meal=>(Array.isArray(meal.category)?meal.category:[meal.category]).forEach(add));
 Object.values(db.plan||{}).forEach(day=>Object.keys(day||{}).forEach(add));
 Object.values(db.settings?.plannerDayOccasions||{}).forEach(list=>(Array.isArray(list)?list:[]).forEach(add));
 return result;
}
function cleanOccasionName(raw){
 const name=String(raw||'').trim().replace(/\s+/g,' ');
 if(!name||name.length>32||/[\x00-\x1f<>]/.test(name)||['__proto__','prototype','constructor'].includes(name.toLowerCase()))return '';
 return name;
}
function addPlannerOccasion(day,raw,custom=false){
 const name=cleanOccasionName(raw);
 if(!name){alert('Please enter an occasion name of 1–32 characters.');return false}
 const existing=getMealOccasions().find(x=>norm(x)===norm(name));
 const occasion=existing||name;
 if(custom&&!existing){db.settings.customMealOccasions??=[];db.settings.customMealOccasions.push(occasion)}
 db.settings.plannerDayOccasions??={};
 const list=db.settings.plannerDayOccasions[day]??=[];
 if(!list.some(x=>norm(x)===norm(occasion))&&!CORE_MEAL_SLOTS.some(x=>norm(x)===norm(occasion)))list.push(occasion);
 save();closeModal();render();
 return true;
}
function openOccasionPicker(day){
 const used=plannerSlotsForDay(day);
 const choices=getMealOccasions().filter(x=>!used.some(y=>norm(x)===norm(y)));
 const title='<div class="occasion-picker-intro"><div class="eyebrow">'+esc(fmtDate(day))+'</div><p>Choose an occasion for this day, or create your own. Custom occasions can be reused on future days.</p></div>';
 const options='<div class="occasion-choice-list">'+(choices.map(name=>'<button type="button" class="occasion-choice" data-occasion="'+esc(name)+'" onclick="addPlannerOccasion(this.dataset.day,this.dataset.occasion)" data-day="'+day+'"><span>'+esc(name)+'</span><span aria-hidden="true">＋</span></button>').join('')||'<p class="smalltext">Every saved occasion is already available for this day.</p>')+'</div>';
 const form='<form id="customOccasionForm" class="occasion-create-form"><label for="customOccasionInput">Create a new occasion</label><div class="occasion-create-row"><input id="customOccasionInput" name="occasion" maxlength="32" required placeholder="e.g. Second breakfast, Afternoon tea…" autocomplete="off"><button type="submit" class="btn green">Create ＋</button></div><p class="smalltext">Save once, reuse on other days.</p></form>';
 showModal('Add a meal occasion',title+options+form);
 document.getElementById('customOccasionForm').onsubmit=e=>{e.preventDefault();addPlannerOccasion(day,e.target.elements.occasion.value,true)};
}
function removeDayOccasion(day,name){
 if(db.plan[day]?.[name]&&!confirm('Remove '+name+' and its planned recipe from this day?'))return;
 if(db.plan[day])delete db.plan[day][name];
 const selected=db.settings.plannerDayOccasions?.[day];
 if(selected)db.settings.plannerDayOccasions[day]=selected.filter(x=>norm(x)!==norm(name));
 save();render();
}

const expandedPlannerDays=new Set();
function plannerSlotsForDay(day){
 const scheduled=db.plan[day]||{};
 const selected=db.settings?.plannerDayOccasions?.[day]||[];
 const all=[...CORE_MEAL_SLOTS,...selected,...Object.keys(scheduled)];
 const seen=new Set();
 return all.filter(name=>{const n=norm(name);if(!n||seen.has(n))return false;seen.add(n);return true});
}

/* Hand-added Kitchen shopping items use the same searchable ingredient
   library as recipes and pantry. Default units follow the ingredient
   or its existing stock, but remain editable. */
function manualShoppingDefaultUnit(ingredient){
 if(!ingredient)return 'piece';
 const stocked=db.inventory.find(row=>row.ingredientId===ingredient.id&&!row.isSpice&&row.unit);
 return stocked?.unit||ingredient.unit||(isSpice(ingredient)?'jar':'piece');
}
function updateManualShoppingIngredient(){
 const form=document.getElementById('manualForm');
 if(!form)return;
 const ingredient=ingById(form.elements.ingredient.value);
 const hint=document.getElementById('manualShoppingIngredientHint');
 const holder=document.getElementById('manualShoppingUnitHolder');
 if(!ingredient){
  hint.textContent='Search your ingredient library and select a suggested ingredient.';
  document.getElementById('manualShoppingPreview').textContent='Choose an ingredient to see its default unit and pantry stock.';
  return;
 }
 const unit=manualShoppingDefaultUnit(ingredient);
 holder.innerHTML=unitSelect('unit',unit,'manual-shopping-unit');
 enhanceSelects(holder);
 const category=ingredient.category||'Other';
 hint.textContent=category+' · Suggested unit: '+unit+(isSpice(ingredient)?' · Spice restock':'');
 form.elements.qty.placeholder=unit==='g'||unit==='ml'?'e.g. 500':'e.g. 1';
 updateManualShoppingPreview();
}
function updateManualShoppingPreview(){
 const form=document.getElementById('manualForm'),preview=document.getElementById('manualShoppingPreview');
 if(!form||!preview)return;
 const ing=ingById(form.elements.ingredient.value),unit=selectedUnit(form.elements.unit);
 const raw=form.elements.qty.value,qty=Number(raw);
 if(!ing){preview.textContent='Choose an ingredient from your library first.';return}
 if(!unit){preview.textContent='Choose a unit of measurement.';return}
 if(!raw||!Number.isFinite(qty)||qty<=0){preview.textContent='Enter how much '+ing.name+' you want to buy.';return}
 const stocked=db.inventory.filter(row=>row.ingredientId===ing.id&&!row.isSpice);
 const compatible=stocked.filter(row=>convertQty(1,row.unit,unit)!==null);
 const stock=compatible.reduce((total,row)=>total+convertQty(Number(row.qty)||0,row.unit,unit),0);
 preview.textContent='Add '+formatQuantity(qty,unit)+' '+ing.name+' to the shopping list.'+(compatible.length?' Currently in pantry: '+formatQuantity(stock,unit)+'.':'');
}

   <div class="sectionhead"><div><h3 style="margin:0">Extra purchases</h3><p class="smalltext">Things you picked up that weren't on the list.</p></div><button type="button" class="btn soft small" onclick="addExtraPurchaseRow()">＋ Add extra</button></div>
   <div id="extraPurchases"></div>
  </div>
  <div class="field"><label>Receipt notes / pasted OCR text (optional)</label><textarea name="receipt" placeholder="Paste receipt text here."></textarea></div>
  <button class="btn green">Save trip & update pantry</button>
 </form>`);
 let form=document.getElementById('finishForm');
 bought.forEach((x,i)=>{
  let sel=form.elements['ingredient_'+i];
  sel.addEventListener('change',()=>{
   let ing=ingById(sel.value),sp=isSpice(ing);
   form.querySelector('#purchaseQty_'+i).style.display=sp?'none':'';
   form.querySelector('#purchaseSpice_'+i).style.display=sp?'':'none';
   if(ing&&!form.elements['unit_'+i].value)form.elements['unit_'+i].value=ing.unit||'';
  });
 });
 form.onsubmit=e=>{
  e.preventDefault();let f=e.target;
  for(let i=0;i<bought.length;i++){
   let ing=ingById(f.elements['ingredient_'+i].value);
   if(ing&&!isSpice(ing)&&!(Number(f.elements['qty_'+i].value)>0)){
    alert(`Enter the quantity actually bought for ${ing.name}, or choose “Do not add to pantry”.`);return;
   }
  }
  let extras=[...form.querySelectorAll('.extra-purchase-row')].map(row=>({
   id:uid(),name:row.querySelector('.extra-name').value.trim(),ingredientId:row.querySelector('.extra-ingredient').value,
   qty:Number(row.querySelector('.extra-qty').value)||0,unit:row.querySelector('.extra-unit').value.trim(),
   category:row.querySelector('.extra-category').value,price:Number(row.querySelector('.extra-price').value)||0,
   checked:true,source:'extra'
  })).filter(x=>x.name);
  for(let x of extras){
   let ing=ingById(x.ingredientId);
   if(ing&&!isSpice(ing)&&!(x.qty>0)){alert(`Enter the quantity bought for ${ing.name}, or unlink it from the pantry.`);return;}
  }
  let savedToPantry=[];
  bought.forEach((x,i)=>{
   let ing=ingById(f.elements['ingredient_'+i].value);
   if(!ing)return;
   if(isSpice(ing)){
    let existing=db.inventory.find(a=>a.ingredientId===ing.id);
    if(existing)existing.spiceStatus=f.elements['spice_'+i].value;
    else db.inventory.push({id:uid(),ingredientId:ing.id,name:ing.name,category:ing.category,isSpice:true,spiceStatus:f.elements['spice_'+i].value});
    savedToPantry.push(ing.name);
   }else{
    let qty=Number(f.elements['qty_'+i].value),unit=f.elements['unit_'+i].value.trim()||ing.unit||'piece';
    let existing=db.inventory.find(a=>a.ingredientId===ing.id&&convertQty(1,a.unit,unit)!==null);
    if(existing){let add=convertQty(qty,unit,existing.unit);existing.qty=Number(existing.qty||0)+add}
    else db.inventory.push({id:uid(),ingredientId:ing.id,name:ing.name,category:ing.category,qty,unit,expiry:'',note:'Added from shopping trip'});
    savedToPantry.push(`${qty} ${unit} ${ing.name}`);
   }
  });
  extras.forEach(x=>{
   let ing=ingById(x.ingredientId);
   if(!ing)return;
   if(isSpice(ing)){
    let existing=db.inventory.find(a=>a.ingredientId===ing.id);
    if(existing)existing.spiceStatus='stocked';
    else db.inventory.push({id:uid(),ingredientId:ing.id,name:ing.name,category:ing.category,isSpice:true,spiceStatus:'stocked'});
    savedToPantry.push(ing.name);
   }else{
    let unit=x.unit||ing.unit||'piece';
    let existing=db.inventory.find(a=>a.ingredientId===ing.id&&convertQty(1,a.unit,unit)!==null);
    if(existing){existing.qty=Number(existing.qty||0)+convertQty(x.qty,unit,existing.unit);}
    else db.inventory.push({id:uid(),ingredientId:ing.id,name:ing.name,category:ing.category,qty:x.qty,unit,expiry:'',note:'Added from extra shopping purchase'});
    savedToPantry.push(`${x.qty} ${unit} ${ing.name}`);
   }
  });
  let tripItems=[...bought.map(x=>({...x})),...extras];
  let tripTotal=(+f.total.value||0)+extras.reduce((a,x)=>a+x.price,0);
  db.history.unshift({id:uid(),date:dateKey(new Date()),store:f.store.value,total:tripTotal,items:tripItems,receipt:f.receipt.value,pantryAdded:savedToPantry});
  db.shopping=db.shopping.filter(x=>!x.checked);
  autoAddOutOfStockSpices();save();closeModal();render();
  alert(`Shopping trip saved. ${savedToPantry.length} item(s) added to your pantry.`);
 };
}
function kitchenView(){let q=window.kitchenQ||'',tab=window.kitchenTab||'Inventory',inv=db.inventory;return `<div class="hero"><div><div class="eyebrow">Your kitchen, accounted for</div><h1>Kitchen</h1><p class="sub">The ingredient library is the source of truth. Inventory tracks what you actually have.</p></div><button class="btn green" onclick="openInventory()">＋ Add inventory</button></div><div class="tabs">${['Inventory','Ingredient library'].map(x=>`<button class="${tab===x?'active':''}" onclick="window.kitchenTab='${x}';render()">${x}</button>`).join('')}</div>${tab==='Inventory'?`<div class="card"><div class="sectionhead"><h2>What you have</h2><span class="badge">${inv.length} tracked</span></div><div class="field"><input placeholder="Search your kitchen…" value="${esc(q)}" aria-label="Search pantry inventory" oninput="window.kitchenQ=this.value;renderKitchenSearch(this.value)"></div><p id="kitchenSearchSummary" class="search-summary" role="status">${inv.filter(x=>fieldWordMatch(x.name,q)).length} items</p><div id="inventoryList">${inv.filter(x=>fieldWordMatch(x.name,q)).map(inventoryRow).join('')||'<div class="empty">Nothing tracked yet. Add an ingredient to start your inventory.</div>'}</div></div>`:`<div class="card"><div class="sectionhead"><div><h2>Ingredient library</h2><p class="smalltext">Search, manage aliases, or create a new canonical ingredient.</p></div><button class="btn green small" onclick="openIngredient()">＋ Create ingredient</button></div><div class="field"><input placeholder="Search ingredients…" value="${esc(q)}" aria-label="Search ingredient library" oninput="window.kitchenQ=this.value;renderLibrarySearch(this.value)"></div><p id="kitchenSearchSummary" class="search-summary" role="status">${db.ingredients.filter(x=>fieldWordMatch(x.name+" "+(x.aliases||[]).join(" "),q)).length} ingredients</p><div id="libraryList">${libraryRows(q)}</div></div>`}`}

function pantryQuantityStep(unit){
 const key=norm(unit||'piece');
 const known={g:50,gram:50,grams:50,kg:.1,mg:100,ml:50,cl:5,dl:1,l:.1,oz:1,lb:.25,tsp:1,tbsp:1,cup:.25};
 return known[key]||1;
}
function adjustPantryQuantity(id,direction){
 const row=db.inventory.find(x=>x.id===id);
 if(!row||row.isSpice||isSpice(ingById(row.ingredientId)))return false;
 const step=pantryQuantityStep(row.unit),before=Math.max(0,Number(row.qty)||0);
 const next=Math.max(0,Number((before+Math.sign(direction)*step).toFixed(6)));
 if(before===next)return false;
 row.qty=next;
 save();
 if(appMode==='kitchen'&&view==='kitchen'&&(window.kitchenTab||'Inventory')==='Inventory')renderKitchenSearch(window.kitchenQ||'');
 return true;
}

function inventoryRow(x){let ing=ingById(x.ingredientId),sp=isSpice(ing)||x.isSpice;return `<div class="listline"><div class="grow"><b>${esc(x.name)}</b><small>${esc(x.category)} · ${sp?'Spice stock: '+(x.spiceStatus||'stocked'):`${esc(formatQuantity(x.qty,x.unit))}`} ${x.expiry?'· Best before '+esc(x.expiry):''}</small></div>${sp?`<span class="badge ${x.spiceStatus==='out'?'orange':''}">${x.spiceStatus==='out'?'Out':x.spiceStatus==='low'?'Low':'Good'}</span>`:`<div class="pantry-quantity-controls" role="group" aria-label="Adjust ${esc(x.name)} quantity"><button type="button" aria-label="Decrease ${esc(x.name)} by ${esc(formatQuantity(pantryQuantityStep(x.unit),x.unit))}" title="Subtract ${esc(formatQuantity(pantryQuantityStep(x.unit),x.unit))}" onclick="adjustPantryQuantity('${x.id}',-1)" ${Number(x.qty)<=0?'disabled':''}>−</button><span class="pantry-current-quantity" aria-live="polite">${esc(formatQuantity(x.qty,x.unit))}</span><button type="button" aria-label="Increase ${esc(x.name)} by ${esc(formatQuantity(pantryQuantityStep(x.unit),x.unit))}" title="Add ${esc(formatQuantity(pantryQuantityStep(x.unit),x.unit))}" onclick="adjustPantryQuantity('${x.id}',1)">＋</button></div>`}<div class="pantry-row-actions"><button class="btn soft small" onclick="openInventory('${x.id}')">Edit</button><button class="btn danger small" aria-label="Delete ${esc(x.name)}" onclick="deleteInventory('${x.id}')">×</button></div></div>`}
function renderKitchenSearch(q){let el=document.getElementById('inventoryList'),items=db.inventory.filter(x=>fieldWordMatch(x.name,q));if(el)el.innerHTML=items.map(inventoryRow).join('')||'<div class="empty">No matching inventory items. Try the beginning of a different word.</div>';updateSearchSummary('kitchenSearchSummary',null,items.length,'items')}

function openIngredient(id=''){let x=id?ingById(id):{id:'',name:'',category:'Produce',unit:'piece',aliases:[],custom:true};showModal(id?'Edit ingredient':'Create ingredient',`<form id="ingForm"><div class="field"><label>Ingredient name</label><input name="name" required value="${esc(x.name)}"></div><div class="two"><div class="field"><label>Category</label><select name="category" onchange="this.form.unit.closest('.field').style.display=this.value==='Spices'?'none':''">${CATS.map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field" style="${x.category==='Spices'?'display:none':''}"><label>Default unit</label>${unitSelect("unit",x.unit||"piece")}</div></div><div class="field"><label>Aliases / spelling variants (comma separated)</label><input name="aliases" value="${esc((x.aliases||[]).join(', '))}" placeholder="e.g. tomatoes, tomate"></div><p class="smalltext">Aliases help Meal Cart recognize different names as the same ingredient when building shopping lists.</p><div class="row"><button class="btn green">Save ingredient</button>${id&&x.custom?`<button type="button" class="btn danger" onclick="deleteIngredient('${id}')">Delete</button>`:''}</div></form>`);document.getElementById('ingForm').onsubmit=e=>{e.preventDefault();let f=e.target,name=f.name.value.trim();let duplicate=db.ingredients.find(i=>norm(i.name)===norm(name)&&i.id!==id);if(duplicate){alert('That ingredient already exists in the library. Edit its aliases instead.');return}let spice=f.category.value==='Spices';if(!spice&&!selectedUnit(f.unit)){alert('Please enter your custom unit.');return}let obj={id:id||uid(),name,category:f.category.value,unit:spice?'':(selectedUnit(f.unit)||'piece'),isSpice:spice,aliases:f.aliases.value.split(',').map(s=>s.trim()).filter(Boolean),custom:true};if(id)db.ingredients[db.ingredients.findIndex(i=>i.id===id)]=obj;else db.ingredients.push(obj);save();closeModal();render()}}

function openInventory(id=''){
 let x=id?db.inventory.find(a=>a.id===id):{id:'',ingredientId:'',qty:'',unit:'',expiry:'',category:'Produce',spiceStatus:'stocked'};

function cleanInventoryRow(x){return `<div class="listline supply-row"><span class="supply-emoji">${cleanEmoji(x.name)}</span><div class="supply-info"><b>${esc(x.name)}</b><small>${esc(x.category)} · ${x.qty} ${esc(x.unit)} · restock at ${x.threshold}</small></div><div class="supply-actions"><span class="badge ${x.qty<=x.threshold?'orange':'gray'}">${x.qty<=x.threshold?'Low':'In stock'}</span><button class="btn soft small" onclick="openCleanProduct('${x.id}')">Update</button></div></div>`}
function trackEssential(id){let e=db.cleaningEssentials.find(x=>x.id===id);if(!e)return;db.cleaningInventory.push({id:uid(),essentialId:e.id,name:e.name,category:e.category,qty:2,threshold:1,unit:'pack'});save();render()}
function openCleanProduct(id=''){let x=id?db.cleaningInventory.find(a=>a.id===id):{name:'',category:'Surfaces',qty:1,threshold:1,unit:'bottle',essentialId:''};showModal(id?'Update cleaning stock':'Add cleaning product',`<form id="cleanForm"><div class="field"><label>Product</label><input name="name" required data-autocomplete-list="cleanNames" value="${esc(x.name)}" placeholder="e.g. Dishwashing liquid"><datalist id="cleanNames">${db.cleaningEssentials.map(e=>`<option value="${esc(e.name)}">`).join('')}</datalist></div><div class="two"><div class="field"><label>Category</label><select name="category">${['Kitchen cleaning','Surfaces','Bathroom','Floors','Laundry','Disinfection','Tools & accessories','Waste','Paper goods','Other'].map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Unit</label><input name="unit" value="${esc(x.unit)}" placeholder="bottle, pack…"></div><div class="field"><label>Quantity you have</label><input name="qty" type="number" min="0" step="any" value="${x.qty}" required></div><div class="field"><label>Low-stock threshold</label><input name="threshold" type="number" min="0" step="any" value="${x.threshold}" required></div></div><p class="smalltext">When quantity is at or below the threshold, Maison adds one restock item to your cart. It won't create duplicates.</p><button class="btn green">Save stock</button>${id?` <button type="button" class="btn danger" onclick="deleteCleanProduct('${id}')">Delete</button>`:''}</form>`);document.getElementById('cleanForm').onsubmit=e=>{e.preventDefault();let f=e.target,name=f.name.value.trim(),essential=db.cleaningEssentials.find(a=>norm(a.name)===norm(name));let obj={id:id||uid(),essentialId:essential?.id||'',name,category:f.category.value,unit:f.unit.value||'unit',qty:+f.qty.value,threshold:+f.threshold.value};if(id)db.cleaningInventory[db.cleaningInventory.findIndex(a=>a.id===id)]=obj;else db.cleaningInventory.push(obj);autoRestock();save();closeModal();render()}}
function deleteCleanProduct(id){db.cleaningInventory=db.cleaningInventory.filter(x=>x.id!==id);save();closeModal();render()}
function autoRestock(){for(const x of db.cleaningInventory){let existing=db.cleaningShopping.find(s=>s.inventoryId===x.id&&!s.checked);if(x.qty<=x.threshold&&!existing)db.cleaningShopping.push({id:uid(),inventoryId:x.id,name:x.name,category:x.category,qty:1,unit:x.unit,checked:false,auto:true});if(x.qty>x.threshold&&existing)db.cleaningShopping=db.cleaningShopping.filter(s=>s.id!==existing.id)}}
function cleanShopView(){let items=db.cleaningShopping;return `<div class="hero"><div><div class="eyebrow">Home care shopping</div><h1>Restock cart</h1><p class="sub">${items.filter(x=>!x.checked).length} products to pick up · low-stock essentials are added automatically.</p></div><button class="btn green" onclick="addCleanManual()">＋ Add to cart</button></div><div class="card">${items.map(x=>`<div class="listline"><input class="check" type="checkbox" ${x.checked?'checked':''} onchange="toggleCleanShop('${x.id}',this.checked)"><span style="font-size:22px">${cleanEmoji(x.name)}</span><div class="grow ${x.checked?'strike':''}"><b>${esc(x.name)}</b><small>${esc(x.category)} · ${x.auto?'Automatic restock':'Added manually'}</small></div><button class="btn danger small" onclick="removeCleanShop('${x.id}')">×</button></div>`).join('')||'<div class="empty">Your home-care cart is empty. Track an essential and lower its stock to trigger automatic restocking.</div>'}</div>`}
function addCleanManual(){showModal('Add to restock cart',`<form id="cleanAddForm"><div class="field"><label>Product</label><input name="name" required placeholder="e.g. Sponges"></div><div class="field"><label>Category</label><select name="category">${['Kitchen cleaning','Surfaces','Bathroom','Floors','Laundry','Disinfection','Tools & accessories','Waste','Paper goods','Other'].map(c=>`<option>${c}</option>`).join('')}</select></div><button class="btn green">Add to cart</button></form>`);document.getElementById('cleanAddForm').onsubmit=e=>{e.preventDefault();let f=e.target;db.cleaningShopping.push({id:uid(),name:f.name.value.trim(),category:f.category.value,checked:false,auto:false});save();closeModal();render()}}
function toggleCleanShop(id,v){let x=db.cleaningShopping.find(a=>a.id===id);if(x){x.checked=v;if(v&&x.inventoryId){let inv=db.cleaningInventory.find(a=>a.id===x.inventoryId);if(inv)inv.qty+=1}}autoRestock();save();render()}
function removeCleanShop(id){db.cleaningShopping=db.cleaningShopping.filter(x=>x.id!==id);save();render()}
function historyView(){return `<div class="hero"><div><div class="eyebrow">Receipts and real-world totals</div><h1>Shopping history</h1><p class="sub">Keep a record of trips, stores and spend.</p></div><div class="badge">${db.history.length} trips</div></div>${db.history.map(h=>`<div class="card" style="margin-bottom:10px"><div class="sectionhead"><div><b>${esc(h.store||'Shopping trip')}</b><div class="smalltext">${fmtDate(h.date)} · ${(h.items||[]).length} items</div></div><div class="row" style="align-items:center;gap:8px"><strong class="price">${money(h.total)}</strong><button class="btn soft small" onclick="editShoppingTrip('${h.id}')">✎ Edit</button></div></div><div class="smalltext">${(h.items||[]).map(x=>esc(x.name)).join(' · ')}</div>${h.receipt?`<details style="margin-top:8px"><summary class="smalltext">Receipt notes / OCR text</summary><p class="smalltext">${esc(h.receipt)}</p></details>`:''}</div>`).join('')||'<div class="empty">No shopping trips recorded yet. Finish a shopping trip to start your history.</div>'}`}
function addManualInventoryFromName(name){let ing=canonicalize(name);db.inventory.push({id:uid(),ingredientId:ing.id,name:ing.name,category:ing.category,qty:1,unit:ing.unit,expiry:'',note:''})}
function imageData(file,max=700,quality=.78){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function enhanceSelects(root){root.querySelectorAll('select:not([hidden])').forEach(sel=>{if(sel.dataset.enhanced)return;sel.dataset.enhanced='1';let multi=sel.multiple||sel.dataset.multi==='true';if(multi)sel.multiple=true;sel.classList.add('styled-select-native');let wrap=document.createElement('div');wrap.className='styled-select';let trigger=document.createElement('button');trigger.type='button';trigger.className='styled-select-trigger';let label=document.createElement('span');let menu=document.createElement('div');menu.className='styled-select-menu';function update(){let chosen=[...sel.selectedOptions].map(o=>o.textContent);label.textContent=chosen.length?(multi?chosen.join(' · '):chosen[0]):(sel.options[0]?.textContent||'Choose…');menu.querySelectorAll('button').forEach((b,i)=>{let on=sel.options[i].selected;b.classList.toggle('selected',on);b.innerHTML=esc(sel.options[i].textContent)+(on?'<span class="tick">✓</span>':'')})}trigger.append(label);trigger.addEventListener('click',()=>{document.querySelectorAll('.styled-select.open').forEach(x=>{if(x!==wrap)x.classList.remove('open')});wrap.classList.toggle('open')});[...sel.options].forEach((opt,i)=>{let b=document.createElement('button');b.type='button';b.className='styled-select-option';b.textContent=opt.textContent;b.addEventListener('click',()=>{if(multi){opt.selected=!opt.selected;update()}else{sel.value=opt.value;update();wrap.classList.remove('open')}sel.dispatchEvent(new Event('change',{bubbles:true}))});menu.append(b)});wrap.append(trigger,menu);sel.insertAdjacentElement('afterend',wrap);update()});if(!root.dataset.selectCloser){root.dataset.selectCloser='1';root.addEventListener('click',e=>{if(!e.target.closest('.styled-select'))root.querySelectorAll('.styled-select.open').forEach(x=>x.classList.remove('open'))})}}
function showModal(title,body){document.getElementById('modtitle').textContent=title;document.getElementById('modbody').innerHTML=body;document.getElementById('modalback').classList.add('show');enhanceSelects(document.getElementById('modbody'))}
function closeModal(){if(window._houseCartConflictChoice)window._houseCartConflictChoice('cancel',true);document.getElementById('modalback').classList.remove('show')}
function go(v){view=v;render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='house-and-cart-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);localStorage.setItem(BACKUP_AT_KEY,new Date().toISOString());updateBackupNotice()}
document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.meals)||!Array.isArray(x.ingredients))throw Error('Not a Meal Cart backup');if(!confirm('Replace this device data with the imported backup?'))return;if(!snapshotForRecovery('Before manual backup import')){alert('A recovery snapshot could not be saved. Please download your current backup first.');return}const restored={...fresh(),...x};localStorage.setItem(KEY,JSON.stringify(restored));db=restored;migrateCareData();save();render();alert('Backup imported.')}catch(err){alert(err.message)}e.target.value=''};
document.getElementById('nav').onclick=e=>{let b=e.target.closest('button[data-view]');if(b)go(b.dataset.view)};
document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
autoRestock();autoAddOutOfStockSpices();render();save();initializeCloud();
</script>
<style>
.smart-panel{background:#fbf4ec;border:1px solid #ead8c9;border-radius:16px;padding:14px;margin:12px 0}.expiry-tag{font-size:11px;border-radius:99px;padding:4px 8px;background:#fff0df;color:#9b5c25;font-weight:800}.cook-overlay{position:fixed;inset:0;background:#f7f1e9;z-index:60;display:none;overflow:auto;padding:22px}.cook-overlay.show{display:block}.cook-inner{max-width:760px;margin:auto}.cook-step{font-size:clamp(23px,4vw,36px);line-height:1.35;padding:28px 0}.aisle-head{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--green);font-weight:900;margin:18px 0 6px}@media(max-width:560px){.cook-overlay{padding:14px}}
</style>
<script>
function expiryItems(){let now=new Date();now.setHours(0,0,0,0);return db.inventory.filter(x=>x.expiry&&!isSpice(ingById(x.ingredientId))).map(x=>({...x,days:Math.ceil((new Date(x.expiry+'T00:00:00')-now)/86400000)})).filter(x=>x.days<=5).sort((a,b)=>a.days-b.days)}
function recipeMatchesPantry(m){let lines=(m.ingredients||[]).filter(x=>!isSpice(ingById(x.ingredientId))),owned=lines.filter(x=>pantryQty(x.ingredientId,x.unit)>=x.qty),missing=lines.filter(x=>pantryQty(x.ingredientId,x.unit)<x.qty);return {owned:owned.length,missing,lines:lines.length,ratio:lines.length?owned.length/lines.length:1}}
function cookableView(){let list=db.meals.flatMap(m=>recipeVersionList(m).map(v=>{let chosen=resolveRecipe(m,v.id);return {m:chosen,...recipeMatchesPantry(chosen)}})).sort((a,b)=>a.missing.length-b.missing.length||b.ratio-a.ratio);return `<div class="hero"><div><div class="eyebrow">Pantry-first inspiration</div><h1>What can I cook?</h1><p class="sub">Recipes ranked by what you already have. Spices are treated as pantry staples.</p></div></div><div class="field"><input placeholder="Search recipes or ingredients…" aria-label="Search cookable recipes" oninput="filterCookable(this.value)"></div><p class="search-summary" id="cookableSearchSummary" role="status">${list.length} recipes</p><div id="cookableSearchEmpty" class="search-no-results hidden">No matching recipes. Try another word beginning.</div><div id="cookableGrid" class="meal-grid">${list.map(x=>`<article class="meal-card" data-q="${esc(norm(x.m.name+' '+x.m.versionName+' '+x.m.ingredients.map(i=>ingById(i.ingredientId)?.name||'').join(' ')))}" onclick="openRecipe('${x.m.id}','${x.m.versionId}')">${x.m.photo?`<img class="meal-photo" src="${x.m.photo}">`:'<div class="meal-photo" style="display:grid;place-items:center;font-size:36px">🍲</div>'}<h3>${esc(x.m.name)}</h3>${x.m.versionId?`<span class="version-chip">${esc(x.m.versionName)}</span>`:''}<div class="badge">${x.missing.length===0?'You have everything':x.missing.length+' ingredient(s) missing'}</div><p class="smalltext">${x.owned}/${x.lines} ingredients in pantry${x.missing.length?'<br>Still need: '+x.missing.map(i=>esc(ingById(i.ingredientId)?.name||'')).join(', '):''}</p></article>`).join('')||'<div class="empty">Add recipes to get pantry-based suggestions.</div>'}</div>`}
function filterCookable(q){let matches=0;document.querySelectorAll('#cookableGrid .meal-card').forEach(x=>{let found=fieldWordMatch(x.dataset.q,q);x.classList.toggle('hidden',!found);if(found)matches++});updateSearchSummary('cookableSearchSummary','cookableSearchEmpty',matches,'recipes')}
function duplicateMeal(id){let m=mealById(id);if(!m)return;let copy=JSON.parse(JSON.stringify(m));copy.id=uid();copy.name=m.name+' (copy)';copy.favorite=false;db.meals.push(copy);save();render();openMeal(copy.id)}
const _mealCard30=mealCard;mealCard=function(m){return _mealCard30(m).replace(`<button class="btn ghost small" onclick="event.stopPropagation();openMeal('${m.id}')">`, `<button type="button" class="btn ghost small duplicate-icon-button" aria-label="Duplicate recipe: ${esc(m.name)}" title="Duplicate recipe" onclick="event.stopPropagation();duplicateMeal('${m.id}')">⧉</button><button class="btn ghost small" onclick="event.stopPropagation();openMeal('${m.id}')">`)};
const _openRecipe30=openRecipe;openRecipe=function(id,versionId=''){_openRecipe30(id,versionId);let a=document.querySelector('#modbody .recipe-detail .row:last-child');if(a)a.insertAdjacentHTML('afterbegin',`<button type="button" class="btn green cooked-recipe-button" onclick="openCookedConfirm('${id}','${versionId}')">✓ I cooked this</button><button type="button" class="btn ghost" onclick="duplicateMeal('${id}')">⧉ Duplicate</button><button type="button" class="btn" onclick="startCooking('${id}','${versionId}')">▶ Cooking mode</button>`)};
function startCooking(id,versionId=''){let parent=mealById(id),m=resolveRecipe(parent,versionId);if(!m)return;let steps=m.steps||[],o=document.getElementById('cookOverlay');o.innerHTML=`<div class="cook-inner"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Maison cooking mode</div><h1>${esc(m.name)}</h1></div><button class="btn ghost" onclick="closeCooking()">✕ Exit</button></div><div class="progress"><i id="cookProgress" style="width:${steps.length?100/steps.length:0}%"></i></div><p id="cookCount" class="smalltext">Step ${steps.length?1:0} of ${steps.length}</p><div id="cookStep" class="cook-step">${steps.length?esc(steps[0]):'No cooking steps yet. Edit this recipe to add them.'}</div><div class="row"><button class="btn ghost" id="cookPrev" onclick="cookMove(-1)" disabled>← Previous</button><button class="btn green" id="cookNext" onclick="cookMove(1)" ${steps.length?'':'disabled'}>Next step →</button></div><div class="smart-panel"><b>Ingredients</b>${(m.ingredients||[]).map(x=>`<div class="listline"><span class="grow">${esc(ingById(x.ingredientId)?.name||'')}</span><b>${isSpice(ingById(x.ingredientId))?'To taste':esc(formatQuantity(x.qty,x.unit))}</b></div>`).join('')}</div></div>`;o.dataset.steps=JSON.stringify(steps);o.dataset.index='0';o.classList.add('show')}
function cookMove(d){let o=document.getElementById('cookOverlay'),a=JSON.parse(o.dataset.steps||'[]'),i=Math.max(0,Math.min(a.length-1,(+o.dataset.index||0)+d));o.dataset.index=i;document.getElementById('cookStep').textContent=a[i]||'';document.getElementById('cookCount').textContent=`Step ${i+1} of ${a.length}`;document.getElementById('cookProgress').style.width=((i+1)/a.length*100)+'%';document.getElementById('cookPrev').disabled=i===0;let b=document.getElementById('cookNext');b.textContent=i===a.length-1?'Finish ✓':'Next step →';b.onclick=i===a.length-1?closeCooking:()=>cookMove(1)}
function closeCooking(){document.getElementById('cookOverlay').classList.remove('show')}
function expiryPanel(){let a=expiryItems();return `<div class="smart-panel"><div class="sectionhead"><b>⏳ Use these soon</b><span class="badge">${a.length}</span></div>${a.slice(0,5).map(x=>`<div class="listline"><div class="grow"><b>${esc(x.name)}</b><small>${x.days<0?'Past best-before date':x.days===0?'Best before today':'Best before in '+x.days+' day(s)'}</small></div><span class="expiry-tag">${x.days<0?'Past date':x.days===0?'Today':x.days+' days'}</span></div>`).join('')||'<p class="smalltext">No upcoming expiry dates. Your pantry is looking fresh.</p>'}</div>`}
const _homeView30=homeView;homeView=function(){return _homeView30()+expiryPanel()+`<div class="card dinner-inspiration-card" style="margin-top:14px"><div class="sectionhead"><div class="inspiration-copy"><div class="eyebrow">YOUR KITCHEN, YOUR IDEAS</div><h2>Need dinner inspiration?</h2><p class="smalltext">Find recipes using what you already own.</p></div><button class="btn green inspiration-action" onclick="go('cookable')"><span>What can I cook?</span><span aria-hidden="true">↗</span></button></div></div>`};
function aisleFor(c,n){let s=norm(c+' '+n);if(/produce|fruit|vegetable/.test(s))return'Fruit & vegetables';if(/meat|fish|seafood|poultry/.test(s))return'Meat & fish';if(/dairy|cheese|milk|egg/.test(s))return'Dairy & chilled';if(/bakery|bread/.test(s))return'Bakery';if(/frozen/.test(s))return'Frozen';if(/spice|herb|condiment|pantry|dry/.test(s))return'Pantry';return'Household & other'}
function shoppingMode(){let groups={};db.shopping.filter(x=>!x.checked).forEach(x=>{let a=aisleFor(x.category,x.name);(groups[a]??=[]).push(x)});showModal('Shopping mode',`<p class="smalltext">Grouped into store-friendly aisles. Tick products as they go into your basket.</p>${Object.entries(groups).map(([a,arr])=>`<div class="aisle-head">${esc(a)}</div>${arr.map(x=>`<label class="listline"><input class="check" type="checkbox" onchange="toggleShop('${x.id}',this.checked)"><span class="grow"><b>${esc(x.name)}</b><small>${x.qty?esc(x.qty+' '+x.unit):'As needed'}</small></span></label>`).join('')}`).join('')||'<div class="empty">Your shopping list is empty.</div>'}`)}
function openReceiptScan(){showModal('Receipt scanner',`<p class="smalltext">Choose a receipt photo. On-device OCR will extract text when supported. Review the result before saving.</p><div class="field"><label>Receipt photo</label><input id="receiptFile" type="file" accept="image/*" capture="environment"></div><div id="receiptStatus" class="smalltext"></div><div class="field"><label>Recognised receipt text</label><textarea id="receiptText" rows="7" placeholder="OCR text appears here, or paste it manually."></textarea></div><div class="two"><div class="field"><label>Store</label><input id="receiptStore" value="${esc(db.settings.store)}"></div><div class="field"><label>Total</label><input id="receiptTotal" type="number" min="0" step=".01"></div></div><button class="btn green" onclick="saveScannedReceipt()">Save receipt</button>`);document.getElementById('receiptFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;let st=document.getElementById('receiptStatus');try{if(!window.Tesseract)await new Promise((ok,no)=>{let t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';t.onload=ok;t.onerror=no;document.head.append(t)});st.textContent='Reading receipt…';let r=await Tesseract.recognize(f,'eng+fra');document.getElementById('receiptText').value=r.data.text;let m=r.data.text.match(/(?:total|à payer|net à payer)[^\d]*(\d+[,.]\d{2})/i);if(m)document.getElementById('receiptTotal').value=m[1].replace(',','.');st.textContent='Text extracted. Please verify the total and store.'}catch(e){st.textContent='OCR unavailable. Paste the text and enter the total manually.'}}}
function saveScannedReceipt(){let txt=document.getElementById('receiptText').value,total=+document.getElementById('receiptTotal').value||0;db.history.unshift({id:uid(),date:dateKey(new Date()),store:document.getElementById('receiptStore').value,total,items:[],receipt:txt,source:'receipt-scan'});save();closeModal();render();alert('Receipt saved. Please verify the extracted total.')}
function editShoppingTrip(id){
 let trip=db.history.find(h=>h.id===id);if(!trip)return;
 let items=Array.isArray(trip.items)?trip.items:[];
 let itemRows=items.map((x,i)=>shoppingTripItemRow(x,i)).join('');
 showModal('Edit shopping trip',`<form id="editTripForm">
  <div class="two">
   <div class="field"><label>Store</label><input name="store" value="${esc(trip.store||'')}" placeholder="Store name"></div>
   <div class="field"><label>Date</label><input name="date" type="date" value="${esc(trip.date||'')}"></div>
  </div>
  <div class="field"><label>Trip total (€)</label><input name="total" type="number" min="0" step=".01" value="${Number(trip.total)||0}"></div>
  <h3>Purchased items</h3>
  <p class="smalltext">Correct names, quantities and prices, or remove/add items. These edits update the trip history and budget, but do not change pantry stock already recorded.</p>
  <div id="editTripItems">${itemRows}</div>
  <button type="button" class="btn soft small" onclick="addShoppingTripEditRow()">＋ Add item</button>
  <div class="field"><label>Receipt notes</label><textarea name="receipt">${esc(trip.receipt||'')}</textarea></div>
  <button class="btn green">Save changes</button>
 </form>`);
 document.getElementById('editTripForm').onsubmit=e=>{
  e.preventDefault();let f=e.target;
  let editedItems=[...f.querySelectorAll('.trip-edit-item')].map(row=>({
   ...((items[Number(row.dataset.original)]||{})),
   name:row.querySelector('.trip-edit-name').value.trim(),
   qty:Number(row.querySelector('.trip-edit-qty').value)||0,
   unit:row.querySelector('.trip-edit-unit').value.trim(),
   price:Number(row.querySelector('.trip-edit-price').value)||0
  })).filter(x=>x.name);
  trip.store=f.store.value.trim();trip.date=f.date.value||trip.date;trip.total=Number(f.total.value)||0;trip.items=editedItems;trip.receipt=f.receipt.value;
  save();closeModal();render();
 };
}
function shoppingTripItemRow(x={},i=null){
 return `<div class="trip-edit-item" data-original="${i===null?'':i}" style="border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0">
  <div class="field"><label>Item</label><input class="trip-edit-name" value="${esc(x.name||'')}" placeholder="Ingredient name"></div>
  <div class="two">
   <div class="field"><label>Quantity</label><input class="trip-edit-qty" type="number" min="0" step="any" value="${x.qty??''}"></div>
   <div class="field"><label>Unit</label><input class="trip-edit-unit" value="${esc(x.unit||'')}" placeholder="g, kg, piece"></div>
  </div>
  <div class="row"><div class="field grow"><label>Item price (€)</label><input class="trip-edit-price" type="number" min="0" step=".01" value="${Number(x.price)||0}"></div><button type="button" class="btn danger small" onclick="this.closest('.trip-edit-item').remove()">Remove</button></div>
 </div>`;
}

function canStartTabSwipe(target){

}
function animateTabSwipe(next,dx){

  {transform:'translate3d('+from+'px,0,0)',opacity:1},
  {transform:'translate3d('+(direction*Math.min(125,window.innerWidth*.32))+'px,0,0)',opacity:.36}
 ],{duration:150,easing:'cubic-bezier(.32,0,.67,0)'});

   {transform:'translate3d('+(-direction*Math.min(76,window.innerWidth*.2))+'px,0,0)',opacity:.52},
   {transform:'translate3d(0,0,0)',opacity:1}
  ],{duration:230,easing:'cubic-bezier(.18,.78,.2,1)'});
